name: CI (public mirror)

# The mirror's workflow. It runs the same suite as the development repository, minus
# the two checks that need historical material this repository does not carry: the
# tree here has one commit and no audit baseline, and copying those checks over would
# be theatre. `npm run test:all` is that subset here, and it ends with
# `verify-export.mjs --require`, which re-hashes every file against
# `export-manifest.json` so a file that rode along fails the build.
#
# Six legs on purpose: a public repository's standard runners are free, so this is
# the only place the full Linux/Windows/macOS x Node 22/24 matrix can run every time.
#
# **This file is written for the mirror, and the mirror is where it runs.** The
# private development repository carries it too, because the export copies it, and
# until now it also *ran* there: every push to `main` paid for a second six-leg
# matrix (macOS is billed at 10x) next to `ci.yml`. Measured over 41 runs in the
# private repository that was 1,919 billed minutes, about 47 per push, for a suite
# that `ci.yml` had already run on the same commit. The job is skipped when the
# repository is private - a skipped job is not billed - and the condition is the
# repository's own visibility, so a fork behaves the same way.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test suite
        run: npm run test:all
        env:
          NODE_OPTIONS: ${{ matrix.node == '22' && '--experimental-sqlite' || '' }}
